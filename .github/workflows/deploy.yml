name: Remote BUILD and DEPLOY
on: [push]
jobs:
  build:
    name: push to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Execute remote SSH commands using SECRET_PRIVATE_KEY
        uses: appleboy/ssh-action@v1
        with:
          host: 13.233.236.168
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SECRET_PRIVATE_KEY}}
          port: 22
          script: |
              cd ~/Spam-Email-Detector
              chmod +x deploy.sh
              ./deploy.sh